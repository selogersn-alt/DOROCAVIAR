{% extends "base.html" %}
{% load static %}

{% block title %}Accueil | DORO CAVIAR - Premium Video Aggregator{% endblock %}

{% block content %}


<!-- MAIN CONTAINER -->
<div class="w-full">
    <!-- Header Section -->
    <div class="flex flex-wrap items-center justify-between gap-4 mb-8 border-b border-brand-border/20 pb-4">
        <h2 class="text-2xl md:text-3xl font-extrabold text-brand-text tracking-tight">
            Dernières <span class="text-brand-primary">Vidéos</span>
        </h2>
        <div class="flex gap-2">
             <!-- Filtres rapides ou tris supplémentaires si besoin -->
        </div>
    </div>

    <!-- Video Grid -->
    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6" id="video-wrapper">
        {% include "videos/video_list_fragment.html" %}
    </div>

    <!-- HTMX Pulsating Loader Indicator -->
    <div id="loader" class="htmx-indicator flex items-center justify-center py-10 w-full">
        <div class="flex gap-1">
            <span class="w-3.5 h-3.5 bg-brand-primary rounded-full animate-bounce delay-100"></span>
            <span class="w-3.5 h-3.5 bg-brand-secondary rounded-full animate-bounce delay-200"></span>
            <span class="w-3.5 h-3.5 bg-brand-primary rounded-full animate-bounce delay-300"></span>
        </div>
    </div>
</div>
{% endblock %}
