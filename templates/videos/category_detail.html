{% extends "base.html" %}
{% block title %}{{ category.name }}{% endblock %}
{% block content %}
<div class="container py-5">
    <h1 class="text-white mb-4">{{ category.name }}</h1>
    <div class="row g-4">
        {% for video in videos %}
        <div class="col-md-3">
            <div class="glass p-3 rounded-4">
                <a href="{% url 'video_detail' video.slug %}" class="text-white text-decoration-none">{{ video.title }}</a>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
