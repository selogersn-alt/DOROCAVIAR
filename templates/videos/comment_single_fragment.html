<div class="flex gap-4 p-5 bg-brand-card hover:bg-brand-glass/50 border border-brand-border/40 rounded-2xl transition duration-200">
    {% if comment.author.profile_image %}
        <img src="{{ comment.author.profile_image.url }}" class="w-11 h-11 rounded-full object-cover border border-brand-border/60">
    {% else %}
        <div class="w-11 h-11 rounded-full bg-brand-primary/10 text-brand-primary border border-brand-border/60 flex items-center justify-center font-extrabold text-sm uppercase">
            {{ comment.author.username|slice:":1" }}
        </div>
    {% endif %}
    <div class="flex-1">
        <div class="flex items-center gap-3 mb-1">
            <span class="font-bold text-sm text-brand-text">{{ comment.author.username }}</span>
            <span class="text-[10px] text-brand-muted font-medium">{{ comment.created_at|timesince }}</span>
        </div>
        <p class="text-brand-text/90 text-sm leading-relaxed whitespace-pre-wrap">{{ comment.content }}</p>
    </div>
</div>
