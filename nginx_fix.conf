# Bloc par défaut
server {
    listen 80 default_server;
    server_name _;
    return 301 http://logertogo.com$request_uri;
}

server {
    listen 80;
    server_name logertogo.com www.logertogo.com agence.logertogo.com hotels.logertogo.com;

    client_max_body_size 2000M;
    client_body_buffer_size 256k;
    client_body_timeout 300s;

    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location /static/ {
        alias /app/staticfiles/;
    }

    location /media/ {
        alias /app/media/;
    }
}

server {
    listen 80;
    server_name save.digitalh.net;
    client_max_body_size 2000M;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://157.180.127.70:13000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    server_name save.digitalh.net;
    client_max_body_size 2000M;

    ssl_certificate /etc/letsencrypt/live/save.digitalh.net/fullchain.pem;        
    ssl_certificate_key /etc/letsencrypt/live/save.digitalh.net/privkey.pem;      

    location / {
        proxy_pass http://157.180.127.70:13000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

