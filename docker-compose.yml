services:
  db:
    image: postgres:15-alpine
    container_name: dorocaviar_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=dorocaviar_db
      - POSTGRES_USER=db_user
      - POSTGRES_PASSWORD=db_password
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    container_name: dorocaviar_redis
    ports:
      - "6379:6379"

  web:
    build: .
    container_name: dorocaviar_web
    command: python manage.py migrate && python manage.py collectstatic --noinput && gunicorn core.wsgi:application --bind 0.0.0.0:8000 --workers 3
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - SECRET_KEY=local_test_key_secret_123456789
      - DATABASE_URL=postgres://db_user:db_password@db:5432/dorocaviar_db
      - REDIS_URL=redis://redis:6379/0
      - USE_BUNNY=False
    depends_on:
      - db
      - redis

  celery:
    build: .
    container_name: dorocaviar_celery
    command: celery -A core worker --loglevel=info
    volumes:
      - .:/app
    environment:
      - DEBUG=True
      - SECRET_KEY=local_test_key_secret_123456789
      - DATABASE_URL=postgres://db_user:db_password@db:5432/dorocaviar_db
      - REDIS_URL=redis://redis:6379/0
      - USE_BUNNY=False
    depends_on:
      - redis
      - db

volumes:
  postgres_data:
